<!doctype html>
<html lang="id">
  <body
    style="
      margin: 0;
      background: #071827;
      color: #eaf8ff;
      font-family: Arial, sans-serif;
      padding: 32px;
    "
  >
    <div
      style="
        max-width: 560px;
        margin: auto;
        padding: 32px;
        border: 1px solid #71c9ed66;
        border-radius: 18px;
        background: #102a3a;
      "
    >
      <p style="letter-spacing: 2px; color: #9adcf5">IKAGAMASS · INTO UGM 2027</p>
      <h1>Halo, {{ name }}!</h1>
      <p>
        Satu langkah lagi: verifikasi alamat emailmu lewat tombol di bawah ini.
      </p>
      <p style="margin: 28px 0">
        <a
          href="{{ verify_url }}"
          style="
            display: inline-block;
            padding: 14px 22px;
            border-radius: 10px;
            background: #8ce6ff;
            color: #062033;
            text-decoration: none;
            font-weight: bold;
            box-shadow: 0 0 24px #8ce6ff66;
          "
        >
          Verifikasi alamat email
        </a>
      </p>
      <p style="color: #a8c4d4; font-size: 13px">
        Tautan ini berlaku selama 20 menit. Jika tombol tidak terbuka, salin tautan berikut:
        <br />
        {{ verify_url }}
      </p>
    </div>
  </body>
</html>
